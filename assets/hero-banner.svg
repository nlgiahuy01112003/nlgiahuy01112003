<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <style>
    .title { font: 800 38px 'Segoe UI', 'Inter', system-ui, sans-serif; fill: #f8fafc; letter-spacing: 0.5px; }
    .subtitle { font: 600 18.5px 'Segoe UI', 'Inter', system-ui, sans-serif; fill: url(#accentGrad); }
    .desc { font: 400 14px 'Segoe UI', 'Inter', system-ui, sans-serif; fill: #94a3b8; }
    .mono { font: 600 12.5px 'Consolas', 'Fira Code', monospace; fill: #cbd5e1; }
    .pill-text { font: 600 12px 'Segoe UI', 'Inter', system-ui, sans-serif; fill: #e2e8f0; }
    .status-text { font: 600 12.5px 'Segoe UI', 'Inter', system-ui, sans-serif; fill: #34d399; }
    .term-header { font: 600 11.5px 'Consolas', monospace; fill: #94a3b8; }
    .term-key { font: 600 12.5px 'Consolas', monospace; fill: #38bdf8; }
    .term-val { font: 400 12.5px 'Consolas', monospace; fill: #e2e8f0; }
    .term-str { font: 400 12.5px 'Consolas', monospace; fill: #a7f3d0; }
    .pulse { animation: pulseAnim 2.2s infinite ease-in-out; }
    .float1 { animation: floatAnim 6s infinite ease-in-out; }
    .float2 { animation: floatAnim 8s infinite ease-in-out reverse; }
    @keyframes pulseAnim {
      0%, 100% { opacity: 1; r: 5px; }
      50% { opacity: 0.45; r: 7px; }
    }
    @keyframes floatAnim {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="310" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="310" rx="16" fill="url(#grid)" />

  <!-- Decorative glowing orbs -->
  <circle cx="150" cy="50" r="110" fill="#38bdf8" opacity="0.08" class="float1" />
  <circle cx="1050" cy="250" r="140" fill="#a855f7" opacity="0.1" class="float2" />
  <circle cx="650" cy="140" r="90" fill="#6366f1" opacity="0.07" />

  <!-- Top Accent Border Line -->
  <rect x="2" y="2" width="1196" height="3" rx="2" fill="url(#accentGrad)" />

  <!-- Left Column: Identity & Value Proposition -->
  <g transform="translate(48, 42)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="445" height="28" rx="14" fill="#064e3b" fill-opacity="0.55" stroke="#10b981" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#10b981" class="pulse" />
    <text x="30" y="18.5" class="status-text">Open to Software Engineer &amp; IT Operations Roles • HCMC / Remote</text>

    <!-- Main Name & Title -->
    <text x="0" y="76" class="title">NGUYỄN LÊ GIA HUY</text>
    <text x="0" y="106" class="subtitle">Full-Stack &amp; AI Systems Engineer • Monorepo &amp; Real-Time Architect</text>

    <!-- Engineering Pitch -->
    <text x="0" y="138" class="desc">Architecting high-concurrency e-commerce, offline-first Edge AI monorepos, grounded Gemini RAG</text>
    <text x="0" y="158" class="desc">pipelines, in-browser WebAssembly code sandboxes, and real-time F&amp;B inventory ecosystems.</text>

    <!-- Core Stack Pills -->
    <g transform="translate(0, 184)">
      <rect x="0" y="0" width="76" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="38" y="18" text-anchor="middle" class="pill-text">Next.js</text>

      <rect x="86" y="0" width="74" height="28" rx="6" fill="#1e293b" stroke="#e11d48" stroke-width="1" />
      <text x="123" y="18" text-anchor="middle" class="pill-text">NestJS</text>

      <rect x="170" y="0" width="74" height="28" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1" />
      <text x="207" y="18" text-anchor="middle" class="pill-text">Flutter</text>

      <rect x="254" y="0" width="142" height="28" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1" />
      <text x="325" y="18" text-anchor="middle" class="pill-text">PostgreSQL + pgvector</text>

      <rect x="406" y="0" width="96" height="28" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
      <text x="454" y="18" text-anchor="middle" class="pill-text">Prisma ORM</text>

      <rect x="512" y="0" width="66" height="28" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1" />
      <text x="545" y="18" text-anchor="middle" class="pill-text">Redis</text>

      <rect x="588" y="0" width="114" height="28" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
      <text x="645" y="18" text-anchor="middle" class="pill-text">Gemini AI &amp; RAG</text>
    </g>
  </g>

  <!-- Right Column: Interactive Terminal Profile Card -->
  <g transform="translate(780, 34)">
    <rect x="0" y="0" width="376" height="242" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <!-- Mac Window Chrome -->
    <rect x="0" y="0" width="376" height="32" rx="12" fill="#1e293b" />
    <circle cx="18" cy="16" r="5.5" fill="#ef4444" />
    <circle cx="36" cy="16" r="5.5" fill="#f59e0b" />
    <circle cx="54" cy="16" r="5.5" fill="#10b981" />
    <text x="188" y="20" text-anchor="middle" class="term-header">giahuy@architect: ~/system-profile.json</text>

    <!-- JSON Code Content -->
    <text x="20" y="56" class="mono">{</text>
    <text x="34" y="78" class="term-key">"engineer"</text><text x="112" y="78" class="term-val">: </text><text x="124" y="78" class="term-str">"Nguyen Le Gia Huy"</text><text x="275" y="78" class="term-val">,</text>
    <text x="34" y="100" class="term-key">"education"</text><text x="118" y="100" class="term-val">: </text><text x="130" y="100" class="term-str">"B.Eng. Software Eng (03/2026)"</text><text x="355" y="100" class="term-val">,</text>
    <text x="34" y="122" class="term-key">"focus"</text><text x="86" y="122" class="term-val">: [</text><text x="102" y="122" class="term-str">"Full-Stack"</text><text x="186" y="122" class="term-val">, </text><text x="196" y="122" class="term-str">"AI/RAG"</text><text x="258" y="122" class="term-val">, </text><text x="268" y="122" class="term-str">"Mobile"</text><text x="330" y="122" class="term-val">],</text>
    <text x="34" y="144" class="term-key">"concurrency"</text><text x="125" y="144" class="term-val">: </text><text x="137" y="144" class="term-str">"SELECT FOR UPDATE + Redis"</text><text x="340" y="144" class="term-val">,</text>
    <text x="34" y="166" class="term-key">"edge_ai"</text><text x="100" y="166" class="term-val">: </text><text x="112" y="166" class="term-str">"Pyodide WASM &amp; TF.js WebGL"</text><text x="328" y="166" class="term-val">,</text>
    <text x="34" y="188" class="term-key">"field_ops"</text><text x="110" y="188" class="term-val">: </text><text x="122" y="188" class="term-str">"EMPOWER SC &amp; DXCENTER (95%+ FCR)"</text>
    <text x="20" y="210" class="mono">}</text>
    <text x="20" y="230" class="status-text">➜ ~ status: all 6 flagship systems operational</text>
  </g>
</svg>
