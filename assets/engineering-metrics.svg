<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 155" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <style>
    .metric-val { font: 800 26px 'Segoe UI', 'Inter', system-ui, sans-serif; }
    .metric-title { font: 700 13px 'Segoe UI', 'Inter', system-ui, sans-serif; fill: #e2e8f0; text-transform: uppercase; letter-spacing: 0.6px; }
    .metric-sub { font: 400 12px 'Segoe UI', 'Inter', system-ui, sans-serif; fill: #94a3b8; }
  </style>

  <!-- Card 1: Concurrency & Web Performance -->
  <g transform="translate(0, 5)">
    <rect x="0" y="0" width="288" height="142" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="20" y="32" class="metric-title">⚡ Concurrency &amp; Web Vitals</text>
    <text x="20" y="70" class="metric-val" fill="#38bdf8">0% Overselling</text>
    <text x="20" y="96" class="metric-sub">PostgreSQL SELECT FOR UPDATE</text>
    <text x="20" y="116" class="metric-sub">95+ Lighthouse • &lt;50ms pg_trgm</text>
    <rect x="20" y="128" width="248" height="4" rx="2" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- Card 2: Edge AI, WASM & RAG Efficiency -->
  <g transform="translate(304, 5)">
    <rect x="0" y="0" width="288" height="142" rx="12" fill="url(#cardBg)" stroke="#a855f7" stroke-width="1.2" />
    <text x="20" y="32" class="metric-title">🧠 Edge AI &amp; Grounded RAG</text>
    <text x="20" y="70" class="metric-val" fill="#c084fc">1,020+ SFIA Qs</text>
    <text x="20" y="96" class="metric-sub">Pyodide WASM &amp; TF.js ($0 Cloud API)</text>
    <text x="20" y="116" class="metric-sub">~85% RAG Upload Saved (SHA-256)</text>
    <rect x="20" y="128" width="248" height="4" rx="2" fill="#a855f7" opacity="0.8" />
  </g>

  <!-- Card 3: Real-Time F&B & AI Inventory -->
  <g transform="translate(608, 5)">
    <rect x="0" y="0" width="288" height="142" rx="12" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.2" />
    <text x="20" y="32" class="metric-title">🧋 Real-Time &amp; AI Inventory</text>
    <text x="20" y="70" class="metric-val" fill="#fbbf24">&lt; 800ms Sync</text>
    <text x="20" y="96" class="metric-sub">Socket.IO UUID Deduplication</text>
    <text x="20" y="116" class="metric-sub">Recipe FIFO • Gemini AI + Zalo Alert</text>
    <rect x="20" y="128" width="248" height="4" rx="2" fill="#f59e0b" opacity="0.8" />
  </g>

  <!-- Card 4: QA Automation & Field Operations -->
  <g transform="translate(912, 5)">
    <rect x="0" y="0" width="288" height="142" rx="12" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.2" />
    <text x="20" y="32" class="metric-title">🛡️ Quality &amp; IT Operations</text>
    <text x="20" y="70" class="metric-val" fill="#34d399">95%+ On-Site FCR</text>
    <text x="20" y="96" class="metric-sub">60+ Playwright E2E • 24+ API Tests</text>
    <text x="20" y="116" class="metric-sub">EMPOWER SC POS &amp; DXCENTER L2</text>
    <rect x="20" y="128" width="248" height="4" rx="2" fill="#10b981" opacity="0.8" />
  </g>
</svg>
